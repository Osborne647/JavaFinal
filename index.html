<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free to Play Games</title>
    <script src="https://kit.fontawesome.com/662da0114d.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./styles.css">
    <script src="index.js"></script>
</head>
<body>
    <header class="navbar">
        <div class="nav content-wrapper">
            <div class="logo">
                <img src="./assets/logo.png" alt="playfree logo" class="logo">
            </div>
            <div class="links">
                <a href="" class="link link__hover-effect">Home</a>
                <a href="" class="link link__hover-effect">Find your next game</a>
            </div>
        </div>
    </header>
    <section id="landing-page">
        <div class="content-wrapper">
            <h1 class="section-title">Fun free games to play</h1>
            <h2 class="section--sub-title">Find your next enjoyable game with <span class="blue">PLAYFREE</span></h2>
        </div>
        <div class="input-wrapper">
            <input class= "input" type="text" placeholder="Search by genre or platform">
            <button class="search"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <figure class="gaming-img-container">
            <img src="./assets/gamingimg.svg" alt="gaming image" class="gaming-img">
        </figure>
    </section>
</body>
</html>
