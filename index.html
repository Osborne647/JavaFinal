<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free to Play Games</title>
    <script src="https://kit.fontawesome.com/662da0114d.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header class="navbar">
        <div class="nav content-wrapper">
            <div class="logo">
                <img src="./assets/logo.png" alt="playfree logo" class="logo">
            </div>
            <div class="links">
                <a href="#" class="link link__hover-effect">Home</a>
                <a href="./games.html" class="link link__hover-effect" onclick="gameData()">Find your next game</a>
            </div>
        </div>
    </header>
    <section id="landing-page">
        <div class="content-wrapper">
            <h1 class="section-title">Fun free games to play</h1>
            <h2 class="section--sub-title">Find your next enjoyable game with <span class="blue">PLAYFREE</span></h2>
        </div>
        <div class="input-wrapper">
            <input class= "input" id="search-input" type="text" placeholder="Search by genre or platform" onkeydown="if(event.key==='Enter') goToSearch()">
            <button class="search" onclick="goToSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <figure class="gaming-img-container">
            <img src="./assets/gamingimg.svg" alt="gaming image" class="gaming-img">
        </figure>
    </section>
    <div class="container">
        <div class="row">
            <div class="game-list">
                <div class="game">
                    <div class="game-card">
                        <div class="game-card__container">
                            <h3>Title</h3>
                            <p><b>thumbnail</b></p>
                            <p><b>Publisher:</b> Publisher</p>
                            <p><b>Genre:</b> Genre</p>
                            <p><b>URL:</b> freetogame_profile_url</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <div class="logo">
            <img src="./assets/logo.png" alt="playfree logo" class="logo">
        </div>
        <div class="row">
        <div class="footer-links">
            <a href="#" class="link link__hover-effect">Home</a>
            <a href="" class="link link__hover-effect">Search</a>
        </div>
        <div class="copyright">PLAYFREE © 2026 |  Created by Nick Osborne</div>
        </div>
    </footer>
</body>
<script src="index.js" unsafe-eval></script>
</html>
